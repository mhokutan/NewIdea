<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geist"; src: url("assets/geist-latin.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
      :root { --ground: #0a1a36; --ink: #f5f5f7; --muted: #9aa6bb; --orange: #ffc233; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1080px; height: 1920px; font-family: "Geist", sans-serif; color: var(--ink); background: var(--ground); }
      .clip { position: absolute; inset: 0; }
      .bg { background: radial-gradient(900px 700px at 50% 100%, rgba(255, 194, 51, 0.22), rgba(255, 194, 51, 0) 70%), var(--ground); }
      .center { padding: 0 90px 220px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
      .big { font-size: 150px; font-weight: 760; letter-spacing: -0.045em; line-height: 1; }
      .mid { font-size: 78px; font-weight: 720; letter-spacing: -0.04em; line-height: 1.05; }
      .small { font-size: 42px; font-weight: 500; color: var(--muted); }
      .o { color: var(--orange); }
      .line { display: block; overflow: hidden; padding-bottom: 0.08em; }
      .line > span { display: inline-block; }
      .shot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      .list { display: flex; flex-direction: column; gap: 44px; text-align: left; align-items: flex-start; }
      .item { font-size: 66px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.08; }
      .item i { display: block; font-style: normal; font-size: 38px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-top: 8px; }
      .icon { width: 300px; height: 300px; border-radius: 68px; box-shadow: 0 30px 90px rgba(255, 194, 51, 0.35); }
      .url { margin-top: 56px; padding: 26px 60px; border-radius: 999px; background: var(--orange); color: #0a1a36; font-size: 46px; font-weight: 740; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25" data-width="1080" data-height="1920">
      <audio id="music" src="assets/music.wav" data-start="0" data-duration="25" data-track-index="9" data-volume="0.7"></audio>
      <div id="ground" class="clip bg" data-start="0" data-duration="25" data-track-index="0"></div>

      <div id="s1" class="clip center big" data-start="0" data-duration="2.2" data-track-index="1">
        <span class="line"><span>New in</span></span>
        <span class="line"><span class="o">Dropolis</span></span>
        <span class="line"><span>1.0.1</span></span>
      </div>

      <img id="i1" class="shot" src="assets/s1.jpg" alt="" data-start="2.2" data-duration="2.6" data-track-index="2" />
      <img id="i2" class="shot" src="assets/s2.jpg" alt="" data-start="4.8" data-duration="2.6" data-track-index="2" />
      <img id="i3" class="shot" src="assets/s3.jpg" alt="" data-start="7.4" data-duration="2.6" data-track-index="2" />
      <img id="i4" class="shot" src="assets/s4.jpg" alt="" data-start="10" data-duration="2.6" data-track-index="2" />
      <img id="i5" class="shot" src="assets/s5.jpg" alt="" data-start="12.6" data-duration="2.6" data-track-index="2" />
      <img id="i6" class="shot" src="assets/s6.jpg" alt="" data-start="15.2" data-duration="2.6" data-track-index="2" />

      <div id="s7" class="clip center" data-start="17.8" data-duration="3.8" data-track-index="1">
        <div class="list">
          <div class="item">Real streets<i>Sidewalks, trees, colourful roofs</i></div>
          <div class="item">Mars with craters<i>Rocky ground and hills</i></div>
          <div class="item">City Festival<i>Login streak now up to day 100</i></div>
        </div>
      </div>

      <div id="s8" class="clip center" data-start="21.6" data-duration="3.4" data-track-index="1">
        <img class="icon" src="assets/icon.jpg" alt="" />
        <div class="mid" style="margin-top: 44px"><span class="line"><span>Dropolis</span></span></div>
        <div class="small" style="margin-top: 8px">Delivery City, now on Google Play</div>
        <div class="url">promovote.com</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const E = "power4.out";
      const lines = (sel, at) => tl.from(`${sel} .line > span`, { yPercent: 110, duration: 0.7, ease: E, stagger: 0.12 }, at);
      lines("#s1", 0.1);
      [["i1", 2.2], ["i2", 4.8], ["i3", 7.4], ["i4", 10], ["i5", 12.6], ["i6", 15.2]].forEach(([id, at], i) => {
        tl.from(`#${id}`, { x: i % 2 ? -120 : 120, opacity: 0, scale: 1.04, duration: 0.55, ease: E }, at);
        tl.to(`#${id}`, { scale: 1.06, duration: 2.1, ease: "none" }, at + 0.55);
      });
      tl.from("#s7 .item", { opacity: 0, y: 50, duration: 0.6, ease: E, stagger: 0.5 }, 17.9);
      tl.from("#s8 .icon", { opacity: 0, scale: 0.6, duration: 0.6, ease: E }, 21.65);
      lines("#s8", 21.9);
      tl.from("#s8 .small", { opacity: 0, y: 16, duration: 0.5, ease: E }, 22.3);
      tl.from("#s8 .url", { opacity: 0, y: 30, scale: 0.92, duration: 0.6, ease: "back.out(1.6)" }, 22.6);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
