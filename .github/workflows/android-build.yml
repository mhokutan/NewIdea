# Android build on GitHub Actions (founder decision 2026-10-07: builds run on GitHub, the desktop only does setup).
# Builds the .aab on a GitHub Linux runner with `eas build --local` (no EAS build minutes; free on this public repo)
# and uploads it to the Google Play closed testing track (alpha) with the Play Developer API.
#
# Start: push a commit to the work branch whose message contains [build android].
# Repository secrets (never in the repo):
#   EXPO_TOKEN           Expo access token (build number and the upload keystore stored on EAS)
#   GOOGLE_PLAY_SA_JSON  contents of the Google Play service account JSON file (Bölüm C3 / D3)
name: Android build

on:
  push:
    branches: [claude/gracious-pasteur-nu8ssc]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    concurrency:
      group: android-build
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build android]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Free disk space (the Android build needs about 15 GB)
        working-directory: /
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true; df -h /

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Check
        run: npx tsc --noEmit && npx expo lint

      - name: Build (local, signed with the EAS upload key)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx -y eas-cli@24.12.1 build --platform android --profile production --local --non-interactive --output "$RUNNER_TEMP/promovote.aab"

      - name: Upload to Google Play (closed testing, alpha)
        env:
          GOOGLE_PLAY_SA_JSON: ${{ secrets.GOOGLE_PLAY_SA_JSON }}
          RELEASE_NOTES: "New: Following tab, creator stats, follow from a promo, save counts and an Activity screen."
        run: node ../../.github/scripts/play-upload.mjs "$RUNNER_TEMP/promovote.aab" alpha
